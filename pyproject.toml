[project]
name = "lienwaiver"
version = "0.1.0"
description = "Lien waiver and cost-to-complete app for Buildout Pros LLC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<0.1",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "authlib>=1.3,<2",
    "itsdangerous>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=7.1,<8",
    "reportlab>=4.0,<6",
    "pillow-heif>=0.18,<2",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.9,<4",
    "structlog>=24.1,<27",
    "cryptography>=42,<51",
    "typer>=0.12,<1",
    "tzdata>=2024.1",
    "anthropic>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lw = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["monthly_partials: run with partial waivers held for the monthly send"]

[tool.setuptools.package-data]
app = ["web/static/*", "web/templates/*.html", "web/templates/partials/*.html", "smartsheet/*.yaml"]
