[project]
name = "lienwaiver"
version = "0.1.0"
description = "Lien waiver and cost-to-complete app for Buildout Pros LLC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "cryptography>=42",
    "typer>=0.12",
    "tzdata>=2024.1",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lw = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
app = ["web/static/*", "web/templates/*.html", "web/templates/partials/*.html", "smartsheet/*.yaml"]
