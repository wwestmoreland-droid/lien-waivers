# Local development. Production runs on Railway (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lw
      POSTGRES_PASSWORD: lw
      POSTGRES_DB: lienwaiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lw"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lw:lw@db:5432/lienwaiver
      DATA_DIR: /data
      APP_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
